name: Garder la base de test éveillée

# Supabase met en pause les projets gratuits après 7 jours sans activité.
# Une requête de lecture tous les 3 jours suffit à garder la base de test active.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête de lecture sur la base de test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: psql "$TEST_DATABASE_URL" -c 'SELECT 1'

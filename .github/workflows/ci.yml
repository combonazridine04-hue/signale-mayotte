name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Back-end — lint, formatage et tests unitaires
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatage
        run: npm run format:check

      # Sans base de données : les tests d'API et de parcours, qui en exigent une,
      # restent lancés à la main (voir backend/README.md).
      - name: Tests unitaires
        run: npm run test:unit

  frontend:
    name: Front-end — lint et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

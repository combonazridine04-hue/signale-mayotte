name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifications:
    name: Lint, formatage, tests unitaires et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatage
        run: npm run format:check

      # Sans base de données : les tests d'API et de parcours, qui en exigent une,
      # restent lancés à la main (voir README).
      - name: Tests unitaires
        run: npm run test:unit

      - name: Build du front
        run: npm run build

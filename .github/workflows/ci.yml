name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifications:
    name: Lint, formatage et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatage
        run: npm run format:check

      - name: Build du front
        run: npm run build
